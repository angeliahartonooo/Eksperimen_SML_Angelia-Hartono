name: Automated Data Preprocessing

on:
  push:
    paths:
      - "telco_churn_raw/**"
      - "preprocessing/automate_Angelia-Hartono.py"
  workflow_dispatch: {}

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn

      - name: Run automated preprocessing
        working-directory: preprocessing
        run: python automate_Angelia-Hartono.py

      - name: Commit and push updated preprocessed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/telco_churn_preprocessing
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update preprocessed dataset [skip ci]"
            git push
          fi
